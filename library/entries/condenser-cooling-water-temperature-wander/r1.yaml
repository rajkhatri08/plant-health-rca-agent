entry_id: condenser-cooling-water-temperature-wander
revision: 1
event_type: process
family: condenser cooling
title: Condenser cooling water temperature varying randomly
description: >-
  The temperature of the cooling water reaching the condenser varies randomly. The
  condenser outlet and the separator temperatures swing, usually both ways, and the
  disturbance reaches the reactor through the recycle gas, where the cooling water
  outlet temperature loop loses its setpoint. Unlike a steady warm supply, the
  temperatures move in both directions rather than only up.
withdrawn: false

