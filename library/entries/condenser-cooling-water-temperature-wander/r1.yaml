actions:
- action_id: check-condenser-cooling-water-supply-variation
  kind: check
  text: Check the cooling water supply temperature to the condenser for variation, and ask the utilities operator about the cooling water system.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: confirm-separator-temperature-variation
  kind: confirm
  text: Confirm the separator temperature variation and how much the condenser cooling water valve is moving.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: escalate-separator-temperature-variation
  kind: escalate
  text: If the separator temperature variation grows, escalate to the shift supervisor.
  safety_preconditions:
  - The shift supervisor decides any response under the site's operating procedures.
  approval_required: true

