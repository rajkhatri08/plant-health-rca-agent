actions:
- action_id: check-reactor-cooling-water-supply-temperature
  kind: check
  text: Check the cooling water supply temperature to the reactor at the utility header, and ask the utilities operator whether the supply has warmed.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  - Any field check follows the site's permit-to-work procedure.
  approval_required: true
- action_id: confirm-reactor-cooling-valve-headroom
  kind: confirm
  text: Confirm that the reactor temperature is holding at its setpoint and that the reactor cooling water valve still has travel left before fully open.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: escalate-reactor-cooling-near-limit
  kind: escalate
  text: If the reactor cooling water valve approaches fully open or the reactor temperature starts to rise, escalate to the shift supervisor before temperature control is lost.
  safety_preconditions:
  - The shift supervisor decides any response under the site's operating procedures.
  approval_required: true

