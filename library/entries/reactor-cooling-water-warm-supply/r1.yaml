entry_id: reactor-cooling-water-warm-supply
revision: 1
event_type: process
family: reactor cooling
title: Reactor cooling water supply warmer than normal
description: >-
  The cooling water reaching the reactor is warmer than usual, so each unit of
  water removes less heat. The reactor temperature controller compensates by
  opening the cooling water valve further, and the reactor temperature stays at
  its setpoint. The fault is masked: the measurements look normal and only the
  valve position shows it. If the supply keeps warming, the valve can run out of
  travel, and the reactor temperature would then rise.
withdrawn: false

