entry_id: mixed-feed-inert-rise
revision: 1
event_type: process
family: feed composition
title: More inert in the mixed feed
description: >-
  The mixed feed carries more inert than normal. The inert doesn't react, so it
  builds up in the gas loop until the purge removes it: the purge composition
  controller opens the purge valve, and the purge flow rises. The reactor feed and
  purge gas analyzers both show more inert, and the pressures around the gas loop
  creep up. The purge is where this fault is handled, so that's where it shows
  first.
withdrawn: false

