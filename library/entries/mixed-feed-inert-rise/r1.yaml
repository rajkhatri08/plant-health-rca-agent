actions:
- action_id: check-mixed-feed-inert-content
  kind: check
  text: Ask for a laboratory sample or the supplier's certificate of the mixed feed to check its inert content.
  safety_preconditions:
  - Sampling follows the site's approved sampling procedure.
  approval_required: true
- action_id: confirm-purge-valve-headroom
  kind: confirm
  text: Confirm the purge valve position and flow, and how much travel the purge valve has left.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: escalate-purge-near-limit
  kind: escalate
  text: If the purge valve approaches fully open or the reactor pressure keeps rising, escalate to the shift supervisor.
  safety_preconditions:
  - The shift supervisor decides any response under the site's operating procedures.
  approval_required: true

