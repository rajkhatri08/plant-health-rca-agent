actions:
- action_id: check-reaction-conditions
  kind: check
  text: Check the reactor operating conditions against their normal ranges, and whether anything changed recently, such as a feed batch or the catalyst.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: confirm-with-laboratory-analysis
  kind: confirm
  text: Confirm with a laboratory analysis of the product that the reaction performance has shifted.
  safety_preconditions:
  - Sampling follows the site's approved sampling procedure.
  approval_required: true
- action_id: escalate-to-process-engineer
  kind: escalate
  text: Escalate to the process engineer, because a slow drift needs an engineering assessment rather than an operator response.
  safety_preconditions:
  - The process engineer decides any response under the site's operating procedures.
  approval_required: true

