entry_id: reaction-rate-drift
revision: 1
event_type: process
family: reaction kinetics
title: Reaction rate drifting slowly
description: >-
  The reaction rate drifts slowly away from normal, in either direction, as can
  happen when catalyst activity or the reaction kinetics change. No single
  controller sees it directly. It shows as the pressures around the gas loop
  (reactor, separator and stripper) moving together, down in most cases and up in
  some. It develops over hours, so it's caught late and not on every run, and the
  evidence for it is weaker than for a step change.
withdrawn: false

