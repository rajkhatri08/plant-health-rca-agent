actions:
- action_id: check-condenser-cooling-water-supply-temperature
  kind: check
  text: Check the cooling water supply temperature to the condenser, and ask the utilities operator whether the supply has warmed.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  - Any field check follows the site's permit-to-work procedure.
  approval_required: true
- action_id: confirm-separator-temperature-trend
  kind: confirm
  text: Confirm the separator temperature trend and how much travel the condenser cooling water valve has left.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: escalate-separator-temperature-rising
  kind: escalate
  text: If the separator temperature keeps rising, escalate to the shift supervisor, since product lost to the purge gas grows while it stays high.
  safety_preconditions:
  - The shift supervisor decides any response under the site's operating procedures.
  approval_required: true

