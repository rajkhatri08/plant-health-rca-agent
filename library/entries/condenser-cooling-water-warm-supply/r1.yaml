entry_id: condenser-cooling-water-warm-supply
revision: 1
event_type: process
family: condenser cooling
title: Condenser cooling water supply warmer than normal
description: >-
  The cooling water reaching the condenser is warmer than usual, so the condenser
  removes less heat. The condenser outlet and the separator it feeds run hotter,
  and more of the product stays in the vapor, which shows as more product 1 in the
  purge gas. No control loop hides this one: the temperatures themselves show it.
  Within the hour the reactor, separator and stripper pressures settle lower and
  the compressor draws less power.
withdrawn: false

