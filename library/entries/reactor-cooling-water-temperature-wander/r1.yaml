actions:
- action_id: check-reactor-cooling-water-supply-variation
  kind: check
  text: Check the cooling water supply temperature to the reactor for variation, and ask the utilities operator about the cooling water system.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: confirm-reactor-temperature-variation
  kind: confirm
  text: Confirm that the reactor temperature variation stays within its operating limits.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: escalate-reactor-temperature-variation
  kind: escalate
  text: If the reactor temperature variation grows, escalate to the shift supervisor.
  safety_preconditions:
  - The shift supervisor decides any response under the site's operating procedures.
  approval_required: true

