entry_id: reactor-cooling-water-temperature-wander
revision: 1
event_type: process
family: reactor cooling
title: Reactor cooling water temperature varying randomly
description: >-
  The temperature of the cooling water reaching the reactor varies randomly. The
  reactor temperature controller keeps moving the cooling water valve, which swings
  both ways, and the reactor temperature itself moves out of its normal band. Unlike
  a steady warm supply, it isn't masked: the reactor temperature shows it, and its
  controller loses its setpoint within the hour. Unlike a sticking valve, the
  cooling water outlet temperature loop keeps compensating.
withdrawn: false

