entry_id: reactant-1-feed-supply-loss
revision: 1
event_type: process
family: feed supply
title: Reactant-1 feed supply lost
description: >-
  The supply of reactant 1 drops. Its flow controller opens the feed valve to make
  up the flow, but the flow keeps falling, and within the hour the valve is fully
  open: the loop has run out of travel. Less reactant 1 reaches the reactor, so
  its share of the reactor feed falls and the reactant-1 composition controller
  loses control as well. The compressor draws less power. The cause is upstream of
  the valve, not the valve itself.
withdrawn: false

