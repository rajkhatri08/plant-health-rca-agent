actions:
- action_id: check-reactant-1-supply
  kind: check
  text: Check the reactant-1 supply, including its header pressure and upstream isolation valves, and ask the upstream unit or supplier whether delivery has dropped.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  - Any field check follows the site's permit-to-work procedure.
  approval_required: true
- action_id: confirm-reactant-1-feed-valve-position
  kind: confirm
  text: Confirm the reactant-1 feed valve position and flow. A fully open valve with a falling flow means the supply is limiting, not the valve.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: escalate-reactant-1-supply-loss
  kind: escalate
  text: Escalate to the shift supervisor, because with reactant 1 short the reactor feed composition and production will drift.
  safety_preconditions:
  - The shift supervisor decides any response, including any rate change, under the site's operating procedures.
  approval_required: true

