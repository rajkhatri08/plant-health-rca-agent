entry_id: mixed-feed-composition-wander
revision: 1
event_type: process
family: feed composition
title: Mixed feed composition varying randomly
description: >-
  The composition of the mixed feed varies randomly instead of shifting once. The
  reactor feed analyzers swing, the reactant-1 composition controller chases them by
  moving the reactant-1 feed, and the pressures around the gas loop move with it.
  The direction changes from case to case, so this entry accepts high or low
  readings. It looks like a reactant ratio shift when the swing goes the same way,
  and the two can tie.
withdrawn: false

