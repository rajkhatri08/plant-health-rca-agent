actions:
- action_id: check-mixed-feed-composition-trend
  kind: check
  text: Ask for repeated laboratory samples of the mixed feed to see whether its composition is varying.
  safety_preconditions:
  - Sampling follows the site's approved sampling procedure.
  approval_required: true
- action_id: confirm-composition-analyzer-health
  kind: confirm
  text: Confirm that the reactor feed analyzers are healthy, with recent calibration and no analyzer alarms, so the variation is real.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: escalate-feed-quality
  kind: escalate
  text: If the mixed feed composition keeps varying, escalate to the process engineer, who can take it up with the supplier.
  safety_preconditions:
  - The process engineer decides any response under the site's operating procedures.
  approval_required: true

