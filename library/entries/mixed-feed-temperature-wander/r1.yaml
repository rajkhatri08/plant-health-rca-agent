entry_id: mixed-feed-temperature-wander
revision: 1
event_type: process
family: feed temperature
title: Mixed feed temperature varying randomly
description: >-
  The temperature of the mixed feed varies randomly. The mixed feed enters the
  stripper, so the stripper temperature moves and its controller works the steam
  valve to hold it. The variation is often too small to cross the alarm limits: this
  entry was written from only two detected runs out of five, so its evidence is
  thin. It accepts the stripper temperature out in either direction, since a random
  variation can go either way.
withdrawn: false

