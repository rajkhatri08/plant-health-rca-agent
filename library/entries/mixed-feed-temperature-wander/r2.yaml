actions:
- action_id: check-mixed-feed-temperature
  kind: check
  text: Check the mixed feed temperature upstream of the stripper, for example at the battery limit or the upstream exchanger, for variation.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  - Any field check follows the site's permit-to-work procedure.
  approval_required: true
- action_id: confirm-stripper-temperature-control
  kind: confirm
  text: Confirm the stripper temperature trend and the stripper steam valve position.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: escalate-stripper-temperature-control
  kind: escalate
  text: If the stripper temperature can't be held, escalate to the shift supervisor.
  safety_preconditions:
  - The shift supervisor decides any response under the site's operating procedures.
  approval_required: true

