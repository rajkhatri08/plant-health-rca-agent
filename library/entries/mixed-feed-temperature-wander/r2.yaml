entry_id: mixed-feed-temperature-wander
revision: 2
event_type: process
family: feed temperature
title: Mixed feed temperature varying randomly
description: >-
  The temperature of the mixed feed varies randomly. The mixed feed enters the
  stripper, so the stripper temperature moves out of its normal band and its
  temperature controller can't hold the setpoint. Because the variation is random,
  the stripper temperature can go out in either direction. The effect is often
  small, so this mechanism can be hard to confirm from the plant data alone.
withdrawn: false

