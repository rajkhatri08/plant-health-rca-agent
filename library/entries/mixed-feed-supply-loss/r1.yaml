actions:
- action_id: check-mixed-feed-supply
  kind: check
  text: Check the mixed feed supply, including its header pressure and upstream isolation valves, and ask the upstream unit or supplier whether delivery has dropped.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  - Any field check follows the site's permit-to-work procedure.
  approval_required: true
- action_id: confirm-mixed-feed-valve-position
  kind: confirm
  text: Confirm the mixed feed valve position and flow. A widely open valve with a falling flow means the supply is limiting, not the valve.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: escalate-mixed-feed-supply-loss
  kind: escalate
  text: Escalate to the shift supervisor, because with the mixed feed short the reactor level, pressure and production all fall.
  safety_preconditions:
  - The shift supervisor decides any response, including any rate change, under the site's operating procedures.
  approval_required: true

