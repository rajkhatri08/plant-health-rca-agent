entry_id: mixed-feed-supply-loss
revision: 1
event_type: process
family: feed supply
title: Mixed feed supply lost
description: >-
  The supply of the mixed feed (reactants 1 and 2) drops. Its flow controller opens
  the feed valve, but the flow keeps falling. Less of both reactants reaches the
  reactor, so both fall in the reactor feed, and the effect spreads through the
  whole plant: the reactor feed rate, level and pressure fall, and many controllers
  lose their setpoints. Unlike a reactant-1 supply loss, it's the mixed feed flow
  that falls, and both reactants drop together.
withdrawn: false

