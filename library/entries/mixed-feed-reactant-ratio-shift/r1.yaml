entry_id: mixed-feed-reactant-ratio-shift
revision: 1
event_type: process
family: feed composition
title: Reactant ratio in the mixed feed shifted
description: >-
  The mixed feed carries less reactant 1 and more reactant 2 than normal. The
  reactor feed analyzers show it first: reactant 1 falls and reactant 2 rises. The
  reactant-1 composition controller responds by raising the reactant-1 feed, so
  that flow and its valve go high, and the pressures around the gas loop (reactor,
  separator and stripper) rise while the compressor draws less power. The feed
  flows don't show the cause; the composition does. Unlike a reactant-1 supply
  loss, the reactant-1 feed flow goes up, not down.
withdrawn: false

