actions:
- action_id: check-mixed-feed-composition
  kind: check
  text: Ask for a laboratory sample or the supplier's certificate of the mixed feed to confirm its reactant ratio.
  safety_preconditions:
  - Sampling follows the site's approved sampling procedure.
  approval_required: true
- action_id: confirm-reactor-feed-analyzer-trends
  kind: confirm
  text: Confirm the reactor feed analyzer trends for reactant 1 and reactant 2, and that the analyzers themselves are healthy, with recent calibration and no analyzer alarms.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: request-composition-setpoint-review
  kind: request_setpoint_change
  text: If the new feed ratio persists, request that the process engineer review the reactor feed composition setpoints.
  safety_preconditions:
  - Only the process engineer or shift supervisor approves a setpoint change, under the site's management-of-change procedure.
  approval_required: true

