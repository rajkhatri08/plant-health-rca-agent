actions:
- action_id: check-reactor-cooling-valve-response
  kind: check
  text: Ask instrument maintenance to check the reactor cooling water valve for sticking, comparing its commanded and actual positions and checking its positioner.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  - Any field work follows the site's permit-to-work procedure.
  approval_required: true
- action_id: confirm-reactor-temperature-cycle
  kind: confirm
  text: Confirm that the reactor temperature, the cooling water outlet temperature and the valve position are cycling together.
  safety_preconditions:
  - Observation only; no change to controller modes or setpoints.
  approval_required: true
- action_id: escalate-reactor-cooling-valve
  kind: escalate
  text: Escalate to the shift supervisor and instrument maintenance, because a sticking valve needs repair.
  safety_preconditions:
  - Any change to the controller's mode or tuning needs the shift supervisor's approval under the site's operating procedures.
  approval_required: true

