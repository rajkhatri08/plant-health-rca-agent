entry_id: reactor-cooling-valve-sticking
revision: 1
event_type: process
family: reactor cooling
title: Reactor cooling water valve sticking
description: >-
  The reactor cooling water valve sticks: it doesn't move until the controller
  pushes hard enough, then jumps. The loop falls into a cycle, so the valve
  position, the cooling water outlet temperature and the reactor temperature all
  swing both ways together, and both temperature loops lose their setpoints. That
  shared cycle on all three is what sets it apart from a varying cooling water
  supply, where the outlet temperature loop keeps compensating.
withdrawn: false

